{% extends "base.html" %}
{% block title %}SpellBattle | Admin{% endblock %}
{% block page %}admin{% endblock %}
{% block content %}
<div class="mx-auto max-w-6xl flex flex-col gap-6">
  <h1 class="text-3xl font-extrabold">Administration</h1>
  <div class="grid gap-6 lg:grid-cols-2">
    <section class="card bg-base-100 border border-base-300">
      <div class="card-body">
        <h2 class="card-title">Letter sets</h2>
        <form id="letterset-form" class="flex flex-col gap-3">
          <input name="name" class="input input-bordered" placeholder="Set name" required />
          <input name="letters" class="input input-bordered uppercase" placeholder="Unique letters" minlength="{{ min_letters }}" maxlength="{{ max_letters }}" required />
          <button class="btn btn-warning" type="submit">Add letter set</button>
        </form>
        <div id="letterset-list" class="mt-4 text-sm"></div>
      </div>
    </section>
    <section class="card bg-base-100 border border-base-300">
      <div class="card-body">
        <h2 class="card-title">Create tournament</h2>
        <form id="tournament-form" class="flex flex-col gap-3">
          <input name="name" class="input input-bordered" placeholder="Tournament name" required />
          <input name="description" class="input input-bordered" placeholder="Description" />
          <input name="max_players" type="number" min="{{ min_players }}" max="{{ max_players }}" value="{{ default_players }}" class="input input-bordered" />
          <input name="allowed_letters" class="input input-bordered uppercase" value="{{ default_letters }}" />
          <fieldset id="skill-options" class="flex flex-wrap gap-2"></fieldset>
          <button class="btn btn-warning" type="submit">Create</button>
        </form>
        <div id="tournament-create-result" class="mt-4 text-sm"></div>
      </div>
    </section>
  </div>
  <section class="card bg-base-100 border border-base-300">
    <div class="card-body">
      <h2 class="card-title">Tournaments</h2>
      <div id="admin-tournaments" class="grid gap-3 md:grid-cols-2"></div>
    </div>
  </section>
  <section class="card bg-base-100 border border-base-300">
    <div class="card-body"><h2 class="card-title">Audit log</h2><div id="admin-actions" class="text-sm"></div></div>
  </section>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/admin.js"></script>{% endblock %}
